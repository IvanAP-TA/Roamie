<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The session check and the first data go to Supabase right after the scripts run: open the connection now. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#fbf4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1216" media="(prefers-color-scheme: dark)" />
    <!-- The theme (Profile → Appearance, or the device's), set before the first paint. Allowed by its hash in
         vercel.json's Content-Security-Policy: keep both in sync (src/lib/theme.test.ts checks). -->
    <script>(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');function a(){var p;try{p=localStorage.getItem('roamie.theme')}catch(e){}var t=p==='light'||p==='dark'?p:m.matches?'dark':'light';d.dataset.theme=t;d.style.colorScheme=t;var c=t==='dark'?'#1a1216':'#fbf4ec';document.querySelectorAll('meta[name="theme-color"]').forEach(function(e){e.content=c})}window.roamieApplyTheme=a;a();m.addEventListener('change',a)})()</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Public pages: scripts/prerender.mjs replaces the seo block and fills #root at build time. -->
    <!--seo:start--><title>Roamie</title><!--seo:end-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
