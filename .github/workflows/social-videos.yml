# Every weekday: plan a post from the guides, write its words, render it, check it and publish it. Monday, Wednesday
# and Friday a video (Reels, Shorts, TikTok); Tuesday and Thursday a carousel (Instagram, TikTok).
# Nothing is published until the repository variable SOCIAL_PUBLISH is "on": until then every run is a dry run whose
# video you can download from the run's page (Artifacts). See video/automation/README.md for the keys.
# The history of posts (what keeps them from repeating) lives on the "social-history" branch, not on main.
name: Social videos

on:
  # The day's run is started at 16:00 UTC (18:00 in Italy in summer, 17:00 in winter) by Supabase's pg_cron, which is
  # punctual (migration social_post_schedule): GitHub's own scheduler starts runs late or drops them. This schedule is
  # only a backup an hour and a half later; an automatic run does nothing if the day's post is already out.
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
    inputs:
      lang:
        description: Language of the post (en or it; empty = the VIDEO_LANG variable, English by default)
        default: ''
      kind:
        description: What to make (empty = the day's choice, video or carousel; check = only test the keys)
        default: ''
      auto:
        description: Started by the daily schedule (skips if the day's post is already out)
        default: 'false'

permissions:
  contents: write

concurrency:
  group: social-videos
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
        working-directory: video

      - name: Previous posts
        run: git show origin/social-history:history.json > video/automation/history.json 2>/dev/null || echo '[]' > video/automation/history.json

      - name: Plan, write, render, check, publish
        working-directory: video
        env:
          VIDEO_LANG: ${{ inputs.lang || vars.VIDEO_LANG || 'en' }}
          POST_KIND: ${{ inputs.kind }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto == 'true' }}
          SOCIAL_UPLOAD_SECRET: ${{ secrets.SOCIAL_UPLOAD_SECRET }}
          PUBLISH: ${{ vars.SOCIAL_PUBLISH }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
        run: node --experimental-strip-types --no-warnings automation/run.mjs

      - name: Keep the video for two weeks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            video/out/post.mp4
            video/out/carousel/
            video/out/props.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save the history
        if: success()
        run: |
          cp video/automation/history.json "$RUNNER_TEMP/history.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/social-history; then
            git switch -c social-history origin/social-history
          else
            git switch --orphan social-history
          fi
          cp "$RUNNER_TEMP/history.json" history.json
          # Vercel reads its settings from the pushed commit: without this, every post would start a failing deploy.
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git add history.json vercel.json
          # An automatic run that found the day's post already out changes nothing.
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Post of $(date -u +%F)"
          git push origin social-history
