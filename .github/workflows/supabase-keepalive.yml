# Free Supabase projects pause after about a week without database activity.
# One tiny query a day through the public API keeps the project awake.
# Needs SUPABASE_URL and SUPABASE_ANON_KEY (both public values) under Settings → Secrets and variables → Actions,
# as repository variables (or, if you'd rather, as secrets with the same names).
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a read-only RPC
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions (Variables tab)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/get_trip_preview" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIV"}'
