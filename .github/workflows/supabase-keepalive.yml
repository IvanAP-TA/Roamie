# Free Supabase projects pause after about a week without database activity.
# One tiny query a day through the public API keeps the project awake.
# The project's URL and publishable key are public (the web app ships them to every browser), so they're written here;
# nothing to set in the repository.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a read-only RPC
        env:
          SUPABASE_URL: https://tvcumfzhnuljngdzuuue.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_HOZGOo8y8klyVzjzempZng_fMiB3ISV
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions (Variables tab)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/get_trip_preview" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIV"}'
